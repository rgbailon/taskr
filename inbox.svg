<text x="294" y="120" font-size="26" font-weight="680" fill="#182536">Inbox</text><text x="294" y="149" font-size="13" fill="#718092">Quickly capture ideas, then give each one a next step.</text><a href="task-details.svg"><rect x="911" y="102" width="137" height="36" rx="9" fill="#173B53"/><text x="979" y="125" text-anchor="middle" font-size="12" font-weight="650" fill="#FFFFFF">＋ Add task</text></a>
<rect x="290" y="177" width="758" height="78" rx="12" fill="#FFFFFF" stroke="#E2E9EF"/><circle cx="319" cy="216" r="12" fill="#E7F3F1"/><path d="M319 210v12M313 216h12" stroke="#378E82" stroke-width="1.7" stroke-linecap="round"/><text x="344" y="213" font-size="13" fill="#6C7B8A">Capture a task or thought…</text><text x="344" y="233" font-size="11" fill="#9AA6B3">Press Enter to keep it in your inbox.</text><rect x="949" y="199" width="74" height="31" rx="8" fill="#F3F6F8"/><text x="986" y="219" text-anchor="middle" font-size="11" fill="#748294">Enter ↵</text>
<text x="294" y="294" font-size="17" font-weight="650" fill="#182536">Needs a home</text><text x="1048" y="294" text-anchor="end" font-size="12" fill="#718092">4 tasks</text>
<a href="task-details.svg"><rect x="290" y="311" width="758" height="54" rx="9" fill="#FFFFFF" stroke="#E5EAF0"/><circle cx="316" cy="338" r="8" fill="#FFF" stroke="#C9D2DC" stroke-width="1.5"/><text x="337" y="335" font-size="13" font-weight="600" fill="#182536">Add a request ID to error responses</text><text x="337" y="352" font-size="11" fill="#718092">Captured just now · quick add</text><text x="895" y="342" text-anchor="middle" font-size="10" fill="#718092">API platform</text><text x="995" y="342" text-anchor="middle" font-size="10" fill="#718092">15 min</text></a>
<a href="task-details.svg"><rect x="290" y="373" width="758" height="54" rx="9" fill="#FFF" stroke="#E5EAF0"/><circle cx="316" cy="400" r="8" fill="#FFF" stroke="#C9D2DC" stroke-width="1.5"/><text x="337" y="397" font-size="13" font-weight="600" fill="#182536">Check keyboard shortcut conflicts</text><text x="337" y="414" font-size="11" fill="#718092">Captured 9:54 AM · quick add</text><text x="895" y="404" text-anchor="middle" font-size="10" fill="#718092">Web dashboard</text><text x="995" y="404" text-anchor="middle" font-size="10" fill="#718092">20 min</text></a>
<a href="task-details.svg"><rect x="290" y="435" width="758" height="54" rx="9" fill="#FFF" stroke="#E5EAF0"/><circle cx="316" cy="462" r="8" fill="#FFF" stroke="#C9D2DC" stroke-width="1.5"/><text x="337" y="459" font-size="13" font-weight="600" fill="#182536">Document local seed data setup</text><text x="337" y="476" font-size="11" fill="#718092">Captured yesterday · quick add</text><text x="895" y="466" text-anchor="middle" font-size="10" fill="#718092">Developer docs</text><text x="995" y="466" text-anchor="middle" font-size="10" fill="#718092">25 min</text></a>
<a href="task-details.svg"><rect x="290" y="497" width="758" height="54" rx="9" fill="#FFF" stroke="#E5EAF0"/><circle cx="316" cy="524" r="8" fill="#FFF" stroke="#C9D2DC" stroke-width="1.5"/><text x="337" y="521" font-size="13" font-weight="600" fill="#182536">Ask Sam to review the event schema</text><text x="337" y="538" font-size="11" fill="#718092">Captured yesterday · quick add</text><text x="895" y="528" text-anchor="middle" font-size="10" fill="#718092">No project</text><text x="995" y="528" text-anchor="middle" font-size="10" fill="#718092">5 min</text></a>
<text x="1100" y="124" font-size="16" font-weight="650" fill="#182536">Quick triage</text><text x="1100" y="147" font-size="12" fill="#718092">A small next step is enough.</text>
<rect x="1100" y="168" width="288" height="72" rx="10" fill="#FFF" stroke="#E5EAF0"/><circle cx="1125" cy="204" r="14" fill="#E7F3F1"/><text x="1125" y="208" text-anchor="middle" font-size="12" font-weight="650" fill="#328F83">1</text><text x="1150" y="199" font-size="12" font-weight="600" fill="#182536">Choose a project</text><text x="1150" y="218" font-size="11" fill="#718092">Give it a useful home.</text>
<rect x="1100" y="250" width="288" height="72" rx="10" fill="#FFF" stroke="#E5EAF0"/><circle cx="1125" cy="286" r="14" fill="#EDF1F8"/><text x="1125" y="290" text-anchor="middle" font-size="12" font-weight="650" fill="#59769B">2</text><text x="1150" y="281" font-size="12" font-weight="600" fill="#182536">Pick a day</text><text x="1150" y="300" font-size="11" fill="#718092">Schedule it when it matters.</text>
<rect x="1100" y="332" width="288" height="72" rx="10" fill="#FFF" stroke="#E5EAF0"/><circle cx="1125" cy="368" r="14" fill="#F7F1E8"/><text x="1125" y="372" text-anchor="middle" font-size="12" font-weight="650" fill="#A47B44">3</text><text x="1150" y="363" font-size="12" font-weight="600" fill="#182536">Keep it here</text><text x="1150" y="382" font-size="11" fill="#718092">If it isn’t ready yet.</text>
<line x1="1100" y1="432" x2="1388" y2="432" stroke="#E7ECF1"/><text x="1100" y="463" font-size="15" font-weight="650" fill="#182536">Recently sorted</text><circle cx="1110" cy="493" r="4" fill="#43AA9B"/><text x="1124" y="497" font-size="12" fill="#182536">Add API contract tests</text><text x="1388" y="497" text-anchor="end" font-size="11" fill="#718092">10:02</text><circle cx="1110" cy="526" r="4" fill="#7797D8"/><text x="1124" y="530" font-size="12" fill="#182536">Review dashboard loading</text><text x="1388" y="530" text-anchor="end" font-size="11" fill="#718092">Yesterday</text>
<rect x="1100" y="575" width="288" height="101" rx="11" fill="#F1F6F7" stroke="#E5ECEE"/><text x="1118" y="603" font-size="13" font-weight="600" fill="#182536">Keep the list light</text><text x="1118" y="627" font-size="12" fill="#718092">Move only tasks you can name</text><text x="1118" y="646" font-size="12" fill="#718092">a next step for.</text><text x="1100" y="720" font-size="11" fill="#8C98A6">Inbox zero is optional.</text>

