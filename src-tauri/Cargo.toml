[package]
name = "tasker"
version = "1.0.0"
description = "Tasker — a calm, local-first focus workspace for developers."
authors = ["Tasker"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "tasker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.43", features = ["bundled"] }
