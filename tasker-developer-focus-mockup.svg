<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
  <title id="title">Tasker — developer focus desktop mockup</title>
  <desc id="desc">A calm task workspace showing a developer’s active task, focus timer, task progress, upcoming work, daily activity, and notes inside a desktop app window.</desc>
  <defs>
    <filter id="windowShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#18283B" flood-opacity=".10"/>
    </filter>
    <clipPath id="windowClip"><rect x="26" y="24" width="1388" height="912" rx="18"/></clipPath>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #182536; }
      .muted { fill: #718092; }
      .faint { fill: #97A3B1; }
      .tiny { font-size: 11px; }
      .small { font-size: 12px; }
      .body { font-size: 13px; }
      .label { font-size: 11px; font-weight: 650; letter-spacing: .55px; }
      .medium { font-size: 14px; font-weight: 550; }
      .strong { font-weight: 650; }
      .line { stroke: #E7ECF1; }
      .icon { fill: none; stroke: #748396; stroke-width: 1.65; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

